limit_req_zone $binary_remote_addr zone=pulse_rl:2m rate=30r/m;

server {
    listen 80;
    server_name pulse.rosamania.ru;
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name pulse.rosamania.ru;

    ssl_certificate /etc/letsencrypt/live/pulse.rosamania.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pulse.rosamania.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    client_max_body_size 1m;
    limit_req_status 429;

    location / {
        limit_req zone=pulse_rl burst=30 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
