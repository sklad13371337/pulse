<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Пульс базы для цветочной сети</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@600;700&display=swap" rel="stylesheet">
<style>
/* Оформление повторяет pulsbazy.kz: тёмная тема, Unbounded для заголовков и цифр, Onest для интерфейса, пилюли-вкладки, фиолетовая тепловая карта. Макет: шапка, воронки, вкладки, заголовок вкладки из двух строк, рабочая область. */
:root{--bg:#0A090B;--bg1:#121014;--bg2:#1A171C;--bg3:#242027;--surface:#121014;--ink:#F5F2F4;--ink2:#C2BBC1;--muted:#9A929B;--line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.13);--accent:#F4BE55;--good:#4FD69C;--warn:#F4BE55;--bad:#FF6B7D;--mute:#9A929B;--info:#A97DEE;--soft:#1A171C;--chip:#3A3340;--focus:#9DB8FF;
--heat0:#221B2D;--heat1:#36274E;--heat2:#4F3476;--heat3:#6C44A4;--heat4:#8C5BD1;--heat5:#A97DEE;--heat6:#C7A8FF;--heat7:#E7D8FF;
--font:'Onest',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--display:'Unbounded','Onest',system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45}
body{background-image:radial-gradient(70% 45% at 85% -8%,rgba(140,91,209,.20),transparent 70%),radial-gradient(50% 35% at 0% 0%,rgba(244,190,85,.07),transparent 70%);background-repeat:no-repeat}
.wrap{max-width:1680px;margin:0 auto;padding:16px 24px}
header.top{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;padding:6px 0 14px;border-bottom:1px solid var(--line);margin-bottom:18px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#FFD36B,#FF8A5B);display:grid;place-items:center;box-shadow:0 6px 20px rgba(255,138,91,.25)}
.brand h1{margin:0;font-size:17px;font-weight:700;letter-spacing:-.01em}
.brand span{color:var(--muted);font-size:13px}
.badge{font-size:12px;padding:5px 11px;border-radius:99px;background:var(--bg2);color:var(--muted);border:1px solid var(--line2)}
.badge.live{color:var(--good);border-color:rgba(79,214,156,.45)}
.funnels{display:flex;flex-wrap:wrap;gap:8px}
button{font-family:inherit;font-size:14px;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.fb{border:1px solid var(--line2);background:var(--bg1);color:var(--ink);padding:9px 16px;border-radius:14px;font-weight:600;text-align:left}
.fb small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.fb[aria-pressed="true"]{background:var(--chip);border-color:rgba(255,255,255,.34)}
.btn{border:1px solid var(--line2);background:rgba(255,255,255,.09);color:var(--ink);padding:9px 16px;border-radius:99px;font-weight:600}
.btn:hover{background:rgba(255,255,255,.16)}
.btn.primary{background:#F5F2F4;color:#0A090B;border-color:#F5F2F4;box-shadow:0 0 28px rgba(255,255,255,.18)}
.btn.primary:hover{background:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
nav.tabs{display:flex;flex-wrap:wrap;gap:4px;padding:5px;background:var(--bg1);border:1px solid var(--line);border-radius:26px;margin:16px 0 26px;width:100%}
nav.tabs button{border:0;background:none;color:var(--muted);padding:9px 16px;border-radius:99px;white-space:nowrap;font-weight:600}
nav.tabs button:hover{color:var(--ink)}
nav.tabs button[aria-selected="true"]{background:var(--chip);color:var(--ink);box-shadow:inset 0 0 0 1px rgba(255,255,255,.2)}
.eyebrow{display:flex;align-items:center;gap:10px;color:var(--accent);font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;margin-bottom:12px}
.eyebrow:before{content:"";width:28px;height:2px;background:currentColor}
.eyebrow.v{color:var(--heat5)}
h2.big{font-family:var(--display);font-weight:700;font-size:clamp(26px,4.4vw,46px);line-height:1.05;letter-spacing:-.045em;margin:0 0 22px;text-wrap:balance}
h2.big span{color:var(--muted)}
.grid{display:grid;gap:14px}
.tiles{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.two{grid-template-columns:repeat(auto-fit,minmax(310px,1fr))}
.card{background:linear-gradient(180deg,rgba(36,32,39,.55),rgba(18,16,20,.85));border:1px solid var(--line);border-radius:20px;padding:18px 20px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.card h2{margin:0 0 12px;font-size:15px;font-weight:700}
.card h3{margin:16px 0 6px;font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.tile .v{font-family:var(--display);font-size:34px;font-weight:700;letter-spacing:-.05em;font-variant-numeric:tabular-nums;line-height:1.1}
.tile .l{color:var(--ink2);font-size:13px;margin-bottom:8px}
.tile .n{font-size:12px;color:var(--muted);margin-top:6px}
.tile.warn .v{color:var(--warn)}.tile.bad .v{color:var(--bad)}.tile.good .v{color:var(--good)}.tile.vio .v{color:var(--heat6)}
.note{font-size:13px;color:var(--muted)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font-weight:600;color:var(--muted);font-size:12px;padding:8px 10px;border-bottom:1px solid var(--line2);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.click{cursor:pointer}tr.click:hover td{background:rgba(255,255,255,.04)}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;white-space:nowrap;border:1px solid currentColor;background:rgba(255,255,255,.03)}
.s-ok{color:var(--good)}.s-due{color:var(--warn)}.s-fading{color:var(--bad)}.s-sleep{color:var(--mute)}.s-new{color:var(--info)}
.p-yes{color:var(--good)}.p-no{color:var(--bad)}
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:160px 1fr 56px;gap:10px;align-items:center;font-size:13px}
.bar i{display:block;height:14px;border-radius:99px;background:currentColor;min-width:4px}
.bar b{text-align:right;font-family:var(--display);font-size:13px;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.cols{display:flex;align-items:flex-end;gap:5px;height:160px;padding-top:18px}
.col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;min-width:0}
.col i{display:block;width:100%;background:linear-gradient(180deg,var(--heat5),var(--heat3));border-radius:6px 6px 0 0;min-height:3px}
.col em{font-style:normal;font-size:10px;color:var(--ink2);font-variant-numeric:tabular-nums;margin-bottom:3px;white-space:nowrap}
.cl{display:flex;gap:5px;margin-top:6px}.cl span{flex:1;text-align:center;font-size:10px;color:var(--muted)}
.bar-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
input[type=text],input[type=number],select,textarea{font-family:inherit;font-size:14px;padding:10px 14px;border:1px solid var(--line2);border-radius:12px;background:var(--bg2);color:var(--ink)}
input[type=text]{border-radius:99px}
textarea{width:100%;min-height:96px}
label.chk{display:flex;align-items:center;gap:8px;font-size:14px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.kv div span{display:block;font-size:12px;color:var(--muted)}
.kv div b{font-family:var(--display);font-size:17px;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.reco{padding:12px 14px;border-radius:14px;background:var(--bg2);border-left:4px solid var(--good);margin:12px 0}
.reco.no{border-left-color:var(--bad)}
.hol{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.drop{border:2px dashed var(--line2);border-radius:20px;padding:20px;text-align:center;color:var(--muted)}
.drop.over{border-color:var(--heat5)}
code{background:var(--bg3);padding:1px 6px;border-radius:6px;font-size:13px}
.msgs{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.msg{background:var(--bg2);border-radius:12px;padding:10px 12px;font-size:13px}
.heat{display:grid;grid-template-columns:auto repeat(6,minmax(0,1fr));gap:6px;align-items:center}
.heat .h{font-size:11px;color:var(--muted);text-align:center;padding:2px 0}
.heat .r{font-size:12px;color:var(--ink2);font-weight:600;padding-right:6px}
.hc{border:0;border-radius:12px;padding:16px 2px;font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:-.03em;font-variant-numeric:tabular-nums;color:var(--ink)}
.hc.dk{color:#0A090B}
.hc:hover{box-shadow:0 0 0 2px rgba(255,255,255,.6)}
.legend{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted);margin-top:14px}
.legend i{flex:0 0 160px;height:10px;border-radius:99px;background:linear-gradient(90deg,var(--heat0),var(--heat3),var(--heat7))}
.chip{display:inline-flex;gap:8px;align-items:center;background:var(--chip);border-radius:99px;padding:5px 6px 5px 12px;font-size:13px}
.chip button{border:0;background:rgba(255,255,255,.12);color:var(--ink);border-radius:99px;width:22px;height:22px;line-height:1;padding:0}
@media (max-width:520px){.bar{grid-template-columns:110px 1fr 46px}.wrap{padding:12px 16px}.hc{font-size:12px;padding:12px 0}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><div class="logo" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1a0f08" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12h4l2.5-6 4 12 3-9 1.5 3H22"/></svg></div><h1>Пульс базы</h1><span>повторные продажи по воронкам AmoCRM</span></div>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span id="srcBadge" class="badge"></span><button class="btn" id="importBtn">Загрузить выгрузку AmoCRM</button><a class="btn" id="logoutBtn" href="/logout" style="display:none;text-decoration:none">Выйти</a></div>
  </header>
  <div class="funnels" id="funnels" role="group" aria-label="Воронка"></div>
  <nav class="tabs" id="tabs" role="tablist" style="margin-top:14px"></nav>
  <main id="view"></main>
</div>

<script>
(function(){
'use strict';
const DAY=86400000;const Y0=2022;const CATS={ann:'Годовщина покупки',pre:'Напомнить заранее',old:'Давно не покупали'};
const today=Math.floor(Date.now()/DAY);
const MONTHS=['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
const SEG={ok:'Покупает как обычно',due:'Пора напомнить',fading:'Пропадает',sleep:'Спящий',new:'Новичок, 1 покупка'};
const TABS=[['pulse','Пульс базы'],['today','Списки на сегодня'],['map','Карта базы'],['card','Карточка клиента'],['top','Лучшие клиенты'],['leads','Лиды'],['dnc','Не писать'],['season','Товары и сезон'],['send','Отправки'],['results','Результаты']];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtN=n=>Math.round(n).toLocaleString('ru-RU');
const rub=n=>fmtN(n)+' ₽';
const dstr=d=>new Date(d*DAY).toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric',timeZone:'UTC'});
const pl=(n,f)=>{const a=Math.abs(n)%100,b=a%10;return f[(a>10&&a<20)?2:(b>1&&b<5)?1:(b===1)?0:2]};
const fmtPhone=p=>/^7\d{10}$/.test(p)?'+7 ('+p.slice(1,4)+') '+p.slice(4,7)+'-'+p.slice(7,9)+'-'+p.slice(9):(p||'нет номера');
const dayOf=(y,m,d)=>Date.UTC(y,m-1,d)/DAY;

/* ---------- состояние ---------- */
const S={pcat:'work',funnel:'Розамания',tab:'pulse',src:{},data:{},A:{},sel:null,mapSel:null,
  f:{seg:'work',ok:true,q:'',cell:null},cardQ:'',aiq:'',aiRes:null,batch:null,
  tpl:'Здравствуйте, {имя}! Это {магазин}. В прошлый раз вы брали: {товар}. Если нужен букет, напишите ответом, соберём к нужному времени.',
  limit:50,bsize:25,ctrl:10,log:[],leads:{},batches:[],lk:'all',lcell:null,dnc:{},dtext:'',dnote:'',dmsg:'',win:14,cost:0,imp:{funnel:'',consent:false,msg:''}};
const logAdd=t=>S.log.unshift({t:new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}),a:t});

/* ---------- демо-данные ---------- */
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const FN=['Анна','Мария','Елена','Ольга','Наталья','Ирина','Светлана','Татьяна','Юлия','Екатерина','Дмитрий','Алексей','Сергей','Андрей','Михаил','Игорь','Виктория','Алина','Оксана','Павел'];
const LN=['Иванова','Петрова','Смирнова','Кузнецова','Попова','Соколова','Лебедева','Козлова','Новикова','Морозова','Волкова','Орлова','Зайцева','Борисова','Егорова','Фомина'];
const PROF={
 'Розамания':{n:420,avg:3200,seed:11,rh:[25,90],items:['Розы красные','Розы микс','Тюльпаны','Хризантемы','Букет авторский','Герберы','Пионы']},
 'Амстердам':{n:300,avg:6500,seed:23,rh:[30,120],items:['Розы Эквадор 60 см','Букет премиум','Пионы','Орхидеи','Гортензии','Композиция в коробке']},
 'Цветобаза':{n:160,avg:14000,seed:37,rh:[7,30],items:['Розы 50 см','Эустома','Гвоздика','Хризантема кустовая','Тюльпаны','Зелень']}
};
function holidays(y){
  const H=[];const add=(n,m,d)=>H.push({n,day:dayOf(y,m,d)});
  add('14 февраля',2,14);add('8 Марта',3,8);add('1 сентября',9,1);add('Новый год',12,31);
  let d=new Date(Date.UTC(y,10,30));while(d.getUTCDay()!==0)d=new Date(d-DAY);
  H.push({n:'День матери',day:d/DAY});
  return H;
}
function genDemo(name){
  const P=PROF[name],r=rng(P.seed),clients=[];
  const pick=a=>a[Math.floor(r()*a.length)];
  const yr=new Date().getUTCFullYear();
  for(let i=0;i<P.n;i++){
    const c={id:name.slice(0,2).toUpperCase()+'-'+(1000+i),name:pick(FN)+' '+pick(LN),
      phone:'7000'+String(Math.floor(r()*1e7)).padStart(7,'0'),consent:r()>0.12,optout:r()<0.04,complaint:r()<0.02,noWa:r()<0.06,
      lastMsg:null,msgs30:0,orders:[]};
    if(r()<0.1){c.lastMsg=today-Math.floor(r()*25);c.msgs30=r()<0.3?2:1}
    const favs=[pick(P.items),pick(P.items)];
    const mk=d=>({d,sum:Math.round(P.avg*(0.5+r()*1.1)/50)*50,items:r()<0.7?[favs[0]]:[favs[0],pick(P.items)]});
    if(r()<0.28){ // покупает к датам
      const hs=[['8 Марта',3,8],['14 февраля',2,14],['День матери',11,28],['Новый год',12,29]];
      const mine=[pick(hs)];if(r()<0.5)mine.push(pick(hs));
      for(let y=yr-2;y<=yr;y++)for(const h of mine){const d=dayOf(y,h[1],h[2])-Math.floor(r()*4);if(d<=today-3&&r()<0.85)c.orders.push(mk(d))}
    }else{
      const I=P.rh[0]+r()*(P.rh[1]-P.rh[0]);const k=1+Math.floor(-Math.log(1-r())*2.6);
      const u=r();const age=u<0.5?r()*I*1.1:u<0.72?I*(1.1+r()*2.2):I*(2.5+r()*8);
      let d=today-Math.round(Math.min(age,540));
      for(let j=0;j<Math.min(k,9)&&d>today-900;j++){c.orders.push(mk(d));d-=Math.round(I*(0.7+r()*0.6))}
    }
    if(!c.orders.length)c.orders.push(mk(today-Math.floor(r()*300)));
    clients.push(c);
  }
  return clients;
}

/* ---------- расчёты ---------- */
function analyze(c){
  const o=c.orders.slice().sort((a,b)=>a.d-b.d),n=o.length,last=o[n-1].d,pause=today-last;
  const total=o.reduce((s,x)=>s+x.sum,0),avgCheck=total/n;
  let avgInt=null,med=null,idx=null;
  if(n>=2){avgInt=Math.max(1,(last-o[0].d)/(n-1));const iv=[];for(let i=1;i<n;i++)iv.push(o[i].d-o[i-1].d);iv.sort((a,b)=>a-b);const m=Math.floor(iv.length/2);med=iv.length%2?iv[m]:(iv[m-1]+iv[m])/2;idx=pause/avgInt}
  let seg;
  if(n===1)seg=pause<=180?'new':'sleep';else seg=idx<0.9?'ok':idx<1.6?'due':idx<3?'fading':'sleep';
  const stake=avgInt?avgCheck*Math.min(3,90/avgInt):avgCheck*0.25;
  const cnt={};o.forEach(x=>x.items.forEach(i=>cnt[i]=(cnt[i]||0)+1));
  const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1]).map(e=>e[0]);
  const tied={};
  o.forEach(x=>{const y=new Date(x.d*DAY).getUTCFullYear();[y-1,y,y+1].forEach(yy=>holidays(yy).forEach(h=>{if(Math.abs(x.d-h.day)<=4)tied[h.n]=(tied[h.n]||0)+1}))});
  const up=[];const yr=new Date().getUTCFullYear();
  [yr,yr+1].forEach(yy=>holidays(yy).forEach(h=>{const left=h.day-today;if(left>=0&&left<=100&&tied[h.n])up.push({n:h.n,left})}));
  up.sort((a,b)=>a.left-b.left);
  const yr0=new Date(today*DAY).getUTCFullYear(),by={};
  o.forEach(x=>{const y=new Date(x.d*DAY).getUTCFullYear();const b=by[y]=by[y]||{n:0,sum:0};b.n++;b.sum+=x.sum});
  const annOf=d=>{const dt=new Date(d*DAY);const m=dt.getUTCMonth()+1;let dd=dt.getUTCDate();if(m===2&&dd===29)dd=28;return dayOf(yr0,m,dd)};
  const hits=(lo,hi)=>{const r=[];o.forEach(x=>{const y=new Date(x.d*DAY).getUTCFullYear();if(y<Y0||y>=yr0)return;const dl=annOf(x.d)-today;if(dl>=lo&&dl<=hi)r.push({o:x,y,dl})});return r};
  const hA=hits(-3,0),hB=hits(1,4);
  const backA=hA.length&&o.some(x=>x.d>=today+Math.min(...hA.map(h=>h.dl))-3&&x.d<=today),backB=hB.length&&pause<=7;
  const cat=[];
  if(hA.length&&!backA&&pause>=14)cat.push('ann');
  if(hB.length&&!backB&&pause>=14)cat.push('pre');
  if(n<=2&&pause>365)cat.push('old');
  return{n,last,pause,total,avgCheck,avgInt,med,idx,seg,stake,top,tied:Object.keys(tied),up,first:o[0].d,sorted:o,by,hA,hB,cat};
}
const CHECKS=[
 ['no_phone','Нет номера телефона',(c)=>!/^7\d{10}$/.test(c.phone)],
 ['no_consent','Нет согласия на рекламные сообщения',(c)=>!c.consent],
 ['optout','Клиент просил не писать',(c)=>c.optout],
 ['complaint','Есть жалоба',(c)=>c.complaint],
 ['no_wa','Номера нет в WhatsApp',(c)=>c.noWa],
 ['dup','Номер повторяется у другого клиента',(c,a,ctx)=>ctx.ph[c.phone]>1],
 ['recent','Писали меньше 7 дней назад',(c)=>c.lastMsg!=null&&today-c.lastMsg<7],
 ['limit','Уже 2 сообщения за 30 дней',(c)=>c.msgs30>=2],
 ['early','Ещё не пора: пауза короче обычного ритма',(c,a)=>a.idx!=null&&a.idx<0.9&&!a.cat.length],
 ['fresh','Единственная покупка меньше 14 дней назад',(c,a)=>a.n===1&&a.pause<14]
];
function build(f){
  const ph={};S.data[f].forEach(c=>{if(c.phone)ph[c.phone]=(ph[c.phone]||0)+1});
  const ctx={ph};
  S.A[f]=S.data[f].map(c=>{const a=analyze(c);const r=CHECKS.filter(k=>k[2](c,a,ctx)).map(k=>k[1]);return{c,a,r}});
}

/* ---------- импорт CSV ---------- */
function csvParse(t){
  t=t.replace(/^\ufeff/,'');const first=t.split(/\r?\n/,1)[0];
  const d=[';','\t',','].map(x=>[x,first.split(x).length]).sort((a,b)=>b[1]-a[1])[0][0];
  const rows=[];let row=[],c='',q=false;
  for(let i=0;i<t.length;i++){const ch=t[i];
    if(q){if(ch==='"'){if(t[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}
    else if(ch==='"')q=true;
    else if(ch===d){row.push(c);c=''}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n')i++;row.push(c);c='';if(row.some(x=>x.trim()!==''))rows.push(row);row=[]}
    else c+=ch}
  row.push(c);if(row.some(x=>x.trim()!==''))rows.push(row);return rows;
}
function pDate(s){s=String(s||'').trim();let m=s.match(/^(\d{1,2})[.\/](\d{1,2})[.\/](\d{4})/);if(m)return dayOf(+m[3],+m[2],+m[1]);m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return dayOf(+m[1],+m[2],+m[3]);return null}
const pSum=s=>{const v=parseFloat(String(s||'').replace(/[\s ]/g,'').replace(',','.').replace(/[^\d.]/g,''));return isFinite(v)?v:0};
const yes=s=>/^\s*(да|yes|true|1|есть|y|согласен|согласна)/i.test(String(s||''));
const normPhone=s=>{let d=String(s||'').replace(/\D/g,'');if(d.length===11&&d[0]==='8')d='7'+d.slice(1);if(d.length===10)d='7'+d;return d};
function importCsv(text,fallbackFunnel,assumeConsent){
  const rows=csvParse(text);if(rows.length<2)return'В файле нет строк с данными.';
  const H=rows[0].map(h=>h.trim()),used=new Set();
  const col=(re)=>{const i=H.findIndex((h,k)=>!used.has(k)&&re.test(h));if(i>=0)used.add(i);return i};
  const cF=col(/воронк/i),cP=col(/телефон|phone/i),cN=col(/контакт|клиент|фио|имя/i),cD=col(/дата.*(закры|оплат|заказ|сделк)|^дата/i),
        cS=col(/бюджет|сумм|стоимост/i),cI=col(/товар|состав|позици|букет/i),cC=col(/соглас/i),cO=col(/отказ|не\s*писать|отпис/i),
        cL=col(/последн.*(рассыл|сообщ)/i),cSt=col(/статус|этап/i),cCo=col(/жалоб/i);
  if(cD<0||cS<0)return'Не нашёл колонки с датой сделки и суммой. Нужны заголовки вроде «Дата закрытия» и «Бюджет».';
  const by={};let deals=0,skipped=0;
  for(const r of rows.slice(1)){
    if(cSt>=0){const st=r[cSt]||'';if(!/успеш|реализ|оплач/i.test(st)||/не\s*реализ|провал/i.test(st)){skipped++;continue}}
    const d=pDate(r[cD]),sum=pSum(r[cS]);if(d==null||!sum||d>today){skipped++;continue}
    const f=(cF>=0&&r[cF]&&r[cF].trim())||fallbackFunnel;
    const ph=cP>=0?normPhone(r[cP]):'',nm=cN>=0?(r[cN]||'').trim():'';
    const key=ph.length>=11?ph:'n:'+nm.toLowerCase();if(key==='n:'){skipped++;continue}
    const items=cI>=0?String(r[cI]||'').split(/\s*[;|,]\s*/).map(x=>x.trim()).filter(Boolean):[];
    by[f]=by[f]||{};
    const c=by[f][key]=by[f][key]||{id:f.slice(0,2).toUpperCase()+'-'+(1000+Object.keys(by[f]).length),name:nm||'Без имени',phone:ph,
      consent:cC>=0?yes(r[cC]):assumeConsent,optout:cO>=0?yes(r[cO]):false,complaint:cCo>=0?yes(r[cCo]):false,noWa:false,lastMsg:null,msgs30:0,orders:[]};
    if(cC>=0&&yes(r[cC]))c.consent=true;if(cO>=0&&yes(r[cO]))c.optout=true;
    if(cL>=0){const lm=pDate(r[cL]);if(lm!=null&&(c.lastMsg==null||lm>c.lastMsg)){c.lastMsg=lm;c.msgs30=today-lm<30?1:0}}
    c.orders.push({d,sum,items});deals++;
  }
  const fs=Object.keys(by);if(!fs.length)return'Не нашёл ни одной подходящей сделки. Проверьте даты (дд.мм.гггг) и статус «Успешно».';
  fs.forEach(f=>{S.data[f]=Object.values(by[f]);S.src[f]='csv';build(f)});
  S.sel=null;S.batch=null;
  logAdd('Загружена выгрузка: '+deals+' '+pl(deals,['сделка','сделки','сделок'])+', воронки: '+fs.join(', ')+(cC<0?'. Колонки согласия нет: '+(assumeConsent?'согласие принято по подтверждению пользователя':'все контакты без согласия'):''));
  if(!fs.includes(S.funnel))S.funnel=fs[0];
  return 'Готово: '+deals+' '+pl(deals,['сделка','сделки','сделок'])+' в воронках: '+fs.join(', ')+(skipped?'. Пропущено строк: '+skipped:'')+(cC<0?'. В файле нет колонки согласия: '+(assumeConsent?'контакты помечены как давшие согласие по вашему подтверждению.':'все контакты помечены как без согласия, рассылка заблокирована.'):'.');
}

function vPulse(){
  const L=cur(),cnt={ok:0,due:0,fading:0,sleep:0,new:0};L.forEach(x=>cnt[x.a.seg]++);
  const y0=today-365;let rev=0;const act=new Set(),rep=new Set();const mon={};
  L.forEach(x=>{let k=0;x.a.sorted.forEach(o=>{if(o.d>y0){rev+=o.sum;k++;const dt=new Date(o.d*DAY);const key=dt.getUTCFullYear()*12+dt.getUTCMonth();mon[key]=(mon[key]||0)+o.sum}});if(k){act.add(x.c.id);if(k>1)rep.add(x.c.id)}});
  const risk=L.filter(x=>x.a.seg==='due'||x.a.seg==='fading').reduce((s,x)=>s+x.a.stake,0);
  const canW=L.filter(x=>(x.a.seg==='due'||x.a.seg==='fading')&&!x.r.length).length;
  const now=new Date(),nk=now.getUTCFullYear()*12+now.getUTCMonth();const ms=[];for(let i=11;i>=0;i--){const k=nk-i;ms.push({k,l:MONTHS[((k%12)+12)%12],v:mon[k]||0})}
  const mx=Math.max(1,...ms.map(m=>m.v));
  const up=[];const seen={};L.forEach(x=>x.a.up.forEach(u=>{seen[u.n]=seen[u.n]||{n:u.n,left:u.left,c:0};seen[u.n].c++}));Object.values(seen).sort((a,b)=>a.left-b.left).forEach(u=>up.push(u));
  const cc={ann:0,pre:0,old:0};L.forEach(x=>x.a.cat.forEach(k=>cc[k]++));const ccOk={ann:0,pre:0,old:0};L.forEach(x=>{if(!x.r.length)x.a.cat.forEach(k=>ccOk[k]++)});
  const catTiles='<div class="grid tiles" style="margin-bottom:12px">'+['ann','pre','old'].map(k=>tile(({ann:'Годовщина: вернуть сегодня',pre:'Напомнить за 4 дня',old:'Давно не покупали'})[k],fmtN(cc[k]),'можно писать: '+fmtN(ccOk[k]),k==='ann'?'good':k==='pre'?'warn':'vio')).join('')+'</div>';
  return catTiles+'<div class="grid tiles">'+
   tile('Клиентов в базе',fmtN(L.length),'активных за 12 мес: '+fmtN(act.size))+
   tile('Покупают как обычно',fmtN(cnt.ok),'ритм в норме','good')+
   tile('Пора напомнить',fmtN(cnt.due),'пауза 0,9–1,6 от ритма','warn')+
   tile('Пропадают',fmtN(cnt.fading),'пауза 1,6–3 ритма','bad')+
   tile('Спящие',fmtN(cnt.sleep),'пауза больше 3 ритмов','vio')+
   '</div><div class="grid two" style="margin-top:12px">'+
   '<div class="card"><h2>Сколько это стоит</h2><div class="kv"><div><span>Выручка за 12 мес</span><b>'+rub(rev)+'</b></div><div><span>Купили повторно из активных</span><b>'+(act.size?Math.round(rep.size/act.size*100):0)+'%</b></div><div><span>Зависит от напоминания (оценка, 90 дн)</span><b>'+rub(risk)+'</b></div><div><span>Из них можно писать сейчас</span><b>'+fmtN(canW)+' '+pl(canW,['клиент','клиента','клиентов'])+'</b></div></div><p class="note">Оценка: средний чек клиента × ожидаемое число его заказов за 90 дней при обычном ритме, только для сегментов «пора» и «пропадает». Это продажи, не прибыль, и не прогноз эффекта рассылки.</p></div>'+
   '<div class="card"><h2>Сегменты</h2>'+barsHtml([{k:'ok',l:SEG.ok,v:cnt.ok},{k:'due',l:SEG.due,v:cnt.due},{k:'fading',l:SEG.fading,v:cnt.fading},{k:'sleep',l:SEG.sleep,v:cnt.sleep},{k:'new',l:'Новички, 1 покупка',v:cnt.new}],Math.max(1,...Object.values(cnt)))+'</div>'+
   '<div class="card"><h2>Выручка по месяцам, ₽ тыс.</h2><div class="cols">'+ms.map(m=>'<div class="col"><em>'+Math.round(m.v/1000)+'</em><i style="height:'+(m.v/mx*100)+'%"></i></div>').join('')+'</div><div class="cl">'+ms.map(m=>'<span>'+m.l+'</span>').join('')+'</div></div>'+
   '<div class="card"><h2>Ближайшие праздники</h2>'+(up.length?'<table><tr><th>Повод</th><th class="num">Через</th><th class="num">Клиентов с привязкой</th></tr>'+up.map(u=>'<tr><td>'+esc(u.n)+'</td><td class="num">'+u.left+' дн</td><td class="num">'+fmtN(u.c)+'</td></tr>').join('')+'</table>':'<p class="note">В ближайшие 100 дней нет праздников, к которым покупали ваши клиенты.</p>')+'</div></div>';
}

const yc=(x,y)=>{const b=x.a.by[y];return b?'<b>'+b.n+'</b>':'<span class="note">·</span>'};
function workList(){
  const f=S.f,q=f.q.trim().toLowerCase();
  let L=cur().filter(x=>{
    const s=x.a.seg;
    if(f.seg==='work'&&!(s==='due'||s==='fading'||(x.a.up.length&&x.a.up[0].left<=21)))return false;
    if(['due','fading','sleep','new','ok'].includes(f.seg)&&s!==f.seg)return false;
    if(f.seg==='season'&&!x.a.up.length)return false;
    if(CATS[f.seg]&&!x.a.cat.includes(f.seg))return false;
    if(f.cell){const cc=f.cell.split('|').map(Number);if(rowOf(x)!==cc[0]||colOf(x)!==cc[1])return false}
    if(f.ok&&x.r.length)return false;
    if(q&&!(x.c.name.toLowerCase().includes(q)||x.c.id.toLowerCase().includes(q)||x.c.phone.includes(q.replace(/\D/g,'')||'§')))return false;
    return true;});
  return L.sort((a,b)=>b.a.stake-a.a.stake);
}

function runAi(q){
  const t=q.toLowerCase();let L=cur().slice();const notes=[];
  let m=t.match(/(\d+)\s*(дн|дней|день|дня)/);if(m){const n=+m[1];L=L.filter(x=>x.a.pause>=n);notes.push('пауза от '+n+' дн')}
  m=t.match(/(?:чек|сумм\w*)[^\d]{0,15}(\d[\d\s]*)/);if(m){const n=+m[1].replace(/\s/g,'');L=L.filter(x=>x.a.avgCheck>=n);notes.push('средний чек от '+fmtN(n)+' ₽')}
  if(/спящ/.test(t)){L=L.filter(x=>x.a.seg==='sleep');notes.push('сегмент «Спящий»')}
  if(/пропад/.test(t)){L=L.filter(x=>x.a.seg==='fading');notes.push('сегмент «Пропадает»')}
  if(/пора|напомн/.test(t)){L=L.filter(x=>x.a.seg==='due');notes.push('сегмент «Пора напомнить»')}
  if(/постоян|регуляр/.test(t)){L=L.filter(x=>x.a.n>=3);notes.push('3 и больше покупок')}
  [['8 марта','8 Марта'],['14 февраля','14 февраля'],['1 сентября','1 сентября'],['новый год|новогод','Новый год'],['матер','День матери']].forEach(h=>{if(new RegExp(h[0]).test(t)){L=L.filter(x=>x.a.tied.includes(h[1]));notes.push('покупали к дате «'+h[1]+'»')}});
  STEMS.forEach(s=>{if(t.includes(s[0])){L=L.filter(x=>x.a.sorted.some(o=>o.items.some(i=>i.toLowerCase().includes(s[1]))));notes.push('брали «'+s[0]+'…»')}});
  if(/можно писать|без отказ/.test(t)){L=L.filter(x=>!x.r.length);notes.push('проходят все проверки')}
  if(!notes.length)return{notes:[],rows:[]};
  return{notes,rows:L.sort((a,b)=>b.a.stake-a.a.stake)};
}

async function dncSend(add,remove,note){
  let r=null;

  if(r){S.dnc=r.dnc;return r}
  const today=Math.floor(Date.now()/DAY),bad=add.filter(p=>!/^7\d{10}$/.test(normPh(p))).length;
  add.map(normPh).filter(p=>/^7\d{10}$/.test(p)).forEach(p=>{if(!S.dnc[p])S.dnc[p]={d:today,note:note||''}});
  remove.map(normPh).forEach(p=>delete S.dnc[p]);

  document.querySelectorAll('[data-lcell]').forEach(b=>b.onclick=()=>{S.lcell=b.dataset.lcell;render()});
  if($('lcellX'))$('lcellX').onclick=()=>{S.lcell=null;render()};
  if($('rWin'))$('rWin').onchange=e=>{S.win=+e.target.value;render()};
  if($('rCost'))$('rCost').onchange=e=>{S.cost=Math.max(0,+e.target.value||0);render()};
  if($('dText'))$('dText').oninput=e=>{S.dtext=e.target.value};
  if($('dNote'))$('dNote').oninput=e=>{S.dnote=e.target.value};
  if($('dAdd'))$('dAdd').onclick=async()=>{const add=S.dtext.split(/[\n,;]+/).map(x=>x.trim()).filter(Boolean);if(!add.length){S.dmsg='Введите хотя бы один номер.';render();return}
    const r=await dncSend(add,[],S.dnote);S.dmsg='Добавлено: '+r.added+(r.bad?', не распознано: '+r.bad+' (номер должен быть российский, 10 или 11 цифр)':'')+(r.local?'. Сервер недоступен, список сохранён только в этом окне.':'.');
    if(r.added)logAdd('«Не писать»: добавлено '+r.added);S.dtext='';applyDnc();render()};
  document.querySelectorAll('[data-dd]').forEach(b=>b.onclick=async()=>{await dncSend([],[b.dataset.dd],'');logAdd('«Не писать»: номер убран');applyDnc();render()});
  if($('pick'))$('pick').onclick=()=>$('file').click();
  const take=file=>{if(!file)return;const fr=new FileReader();fr.onload=()=>{let txt=new TextDecoder('utf-8').decode(fr.result);if(txt.includes('\ufffd'))try{txt=new TextDecoder('windows-1251').decode(fr.result)}catch(_){}
    S.imp.msg=importCsv(txt,$('impF').value,$('impC').checked);render()};fr.readAsArrayBuffer(file)};
  if($('file'))$('file').onchange=e=>take(e.target.files[0]);
  if($('drop')){const d=$('drop');d.ondragover=e=>{e.preventDefault();d.classList.add('over')};d.ondragleave=()=>d.classList.remove('over');d.ondrop=e=>{e.preventDefault();d.classList.remove('over');take(e.dataTransfer.files[0])}}
  if($('impDemo'))$('impDemo').onclick=()=>{Object.keys(PROF).forEach(f=>{S.data[f]=genDemo(f);S.src[f]='demo';build(f)});S.funnel='Розамания';S.imp.msg='Демо-данные возвращены.';render()};
  if($('impClose'))$('impClose').onclick=()=>{showImp=false;render()};
  document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{S.funnel=b.dataset.f;S.lcell=null;S.sel=null;S.mapSel=null;S.f.cell=null;S.batch=null;S.aiRes=null;render()});
  document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{S.tab=b.dataset.t;render()});
}
document.getElementById('importBtn').onclick=()=>{showImp=!showImp;render()};
Object.keys(PROF).forEach(f=>{S.data[f]=genDemo(f);S.src[f]='demo';build(f)});
S.loading=/^https?:/.test(location.protocol);
render();
fetch('data.json',{cache:'no-store'}).then(r=>{if(r.status===401){location.href='/login';return Promise.reject()}return r.ok?r.json():Promise.reject()}).then(j=>{S.loading=false;const fs=Object.keys(j.funnels||{});if(!fs.length){render();return}S.data={};S.src={};fs.forEach(f=>{S.data[f]=j.funnels[f];S.src[f]='csv';build(f)});S.funnel=fs[0];S.server=true;S.leads=j.leads||{};S.batches=j.batches||[];S.dnc=j.dnc||{};applyDnc();S.updated=j.generated;logAdd('Данные AmoCRM загружены с сервера, обновлены '+j.generated);render()}).catch(()=>{S.loading=false;render()});
})();
</script>
</body>
</html>
